spring.application.name=backend

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/personal_os?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:personalos}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080

# JWT Configuration
personalos.jwt.secret=${PERSONALOS_JWT_SECRET:${personalos.jwt.secret}}

# Frontend configuration
personalos.frontend.url=${PERSONALOS_FRONTEND_URL:http://localhost:5173}

# Optional local overrides for development secrets (ignored by Git)
spring.config.import=optional:file:./application-local.properties,optional:file:application-local.properties

# Google OAuth Configuration
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:not-configured}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:not-configured}
