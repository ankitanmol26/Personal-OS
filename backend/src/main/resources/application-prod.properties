# PersonalOS Production Profile Configuration (spring.profiles.active=prod)
spring.application.name=backend

# Server Configuration (Render injects PORT env variable)
server.port=${PORT:8080}
server.shutdown=graceful

# Database Configuration (Supplied via environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pooling (Optimized for cloud managed MySQL e.g., Aiven)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration (Strictly no automatic DDL alteration in production)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Migration Policy for Production (Auto-DDL and Bootstrap user are explicitly DISABLED)
personalos.migration.auto-ddl.enabled=false
personalos.migration.bootstrap-user.enabled=false

# JWT Configuration (Required in production)
personalos.jwt.secret=${PERSONALOS_JWT_SECRET}
personalos.jwt.expiration-ms=${PERSONALOS_JWT_EXPIRATION_MS:86400000}

# Allowed Frontend Origins (Render backend -> Vercel frontend)
personalos.frontend.url=${PERSONALOS_FRONTEND_URL}

# Google OAuth Credentials
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

# Cookie Security Settings for Cross-Origin Production (Render backend <-> Vercel frontend)
personalos.cookies.secure=true
personalos.cookies.same-site=None
